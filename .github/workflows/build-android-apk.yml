name: Build and publish Android APK

on:
  push:
    branches:
      - android03
    paths-ignore:
      - "Dzirent-android03-debug.apk"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android03-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out android03
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure public Supabase client settings, when available
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_ANON_KEY" ]]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > android/local.properties
          else
            echo "::warning::SUPABASE_URL and SUPABASE_ANON_KEY must be set as Actions secrets for the app to connect to the backend. APK will build with the existing placeholder values."
          fi

      - name: Assemble debug-signed APK
        working-directory: android
        run: |
          # Android requires Java 17; the checked-in daemon pin targets a
          # locally installed JetBrains JDK 21 unavailable on hosted runners.
          # Omit only for CI, leaving the branch's developer config untouched.
          rm -f gradle/gradle-daemon-jvm.properties
          bash ./gradlew --no-daemon :app:assembleDebug

      - name: Copy APK to repository root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Dzirent-android03-debug.apk
          test -s Dzirent-android03-debug.apk
          ls -lh Dzirent-android03-debug.apk

      - name: Upload APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dzirent-android03-debug
          path: Dzirent-android03-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to android03 root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Dzirent-android03-debug.apk
          if git diff --cached --quiet; then
            echo "APK bytes unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "build: publish installable android03 APK [skip ci]"
          git push origin HEAD:android03
